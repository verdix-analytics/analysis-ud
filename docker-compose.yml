services:
  app:
    build: .
    container_name: cs50_backend_app
    env_file: .env
    volumes:
      - ./certs:/app/certs:ro
      - .:/app 
    # --- ADD THESE FOR TESTING ---
    tty: true           # Keeps the container "open" even if no script is running
    stdin_open: true    # Allows you to interact with it
    # -----------------------------
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - financial-net
  
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    container_name: kafka-local
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker, controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://0.0.0.0:9092,CONTROLLER://kafka:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT,CONTROLLER:PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_LOG_RETENTION_HOURS: 168

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qg
  
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "kafka-topics", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - financial-net

  kafka-init:
      image: confluentinc/cp-kafka:7.6.1
      container_name: kafka-init
      depends_on:
        kafka:
          condition: service_healthy
      entrypoint: ["/bin/bash", "-c"]
      command: |
        "
        echo 'Creating Kafka topics...'
        for topic in financial-prices financial-patterns financial-trades; do
          kafka-topics --bootstrap-server kafka:29092 \
            --create --if-not-exists \
            --topic $$topic \
            --partitions 3 \
            --replication-factor 1
          echo \"Ready: $$topic\"
        done
        echo 'All topics created.'
        "
      restart: "no"
      networks:
        - financial-net

  kafka-ui:
      image: provectuslabs/kafka-ui:latest
      container_name: kafka-ui
      restart: unless-stopped
      depends_on:
        kafka:
          condition: service_healthy
      ports:
        - "8080:8080"
      environment:
        KAFKA_CLUSTERS_0_NAME: local
        KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
      networks:
        - financial-net

  postgres:
      image: postgres:16-alpine
      container_name: postgres-local
      restart: unless-stopped
      ports:
        - "5432:5432"       # Host access (e.g. pgAdmin, DBeaver)
      environment:
        POSTGRES_USER: localadmin
        POSTGRES_PASSWORD: localpass
        POSTGRES_DB: cs50db
      volumes:
        - postgres-data:/var/lib/postgresql/data
        - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro   # Runs once on first start
      healthcheck:
        test: ["CMD-SHELL", "pg_isready -U localadmin -d cs50db"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
      networks:
        - financial-net

  redis:
      image: redis:7-alpine
      container_name: redis-local
      restart: unless-stopped
      ports:
        - "6379:6379"       # Host access (e.g. RedisInsight)
      command: redis-server --requirepass localpass
      volumes:
        - redis-data:/data
      healthcheck:
        test: ["CMD", "redis-cli", "-a", "localpass", "ping"]
        interval: 10s
        timeout: 5s
        retries: 5
        start_period: 10s
      networks:
        - financial-net
  
volumes:
  kafka-data:
  postgres-data:
  redis-data:

networks:
  financial-net:
    driver: bridge